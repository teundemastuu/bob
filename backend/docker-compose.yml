services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: process_hitl
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d process_hitl"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      BPMN_GENERATOR_URL: ${BPMN_GENERATOR_URL:-http://host.docker.internal:8098}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/code

  frontend:
    build:
      context: ../frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
